version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learnpath-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=LearnPath AI
      - APP_ENV=production
      - DATABASE_URL=sqlite:///./learnpath.db
      - FRONTEND_URL=http://localhost
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learnpath-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-data:
